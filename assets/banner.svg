<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing ambient gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald-glow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Title text gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pill linear gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.035);
        stroke-width: 1;
      }
      .node-pulse {
        animation: pulseRing 3.5s ease-in-out infinite alternate;
      }
      .node-pulse-fast {
        animation: pulseRingFast 2.2s ease-in-out infinite alternate;
      }
      .beam-line {
        stroke-dasharray: 8 16;
        animation: beamMove 24s linear infinite;
      }
      .glow-orb {
        animation: floatOrb 9s ease-in-out infinite alternate;
      }
      .pill-border {
        stroke: rgba(56, 189, 248, 0.35);
        stroke-width: 1.2;
      }
      .search-ring {
        animation: searchSweep 6s ease-in-out infinite;
        transform-origin: 1060px 100px;
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.18); opacity: 0.9; }
      }
      @keyframes pulseRingFast {
        0% { transform: scale(0.9); opacity: 0.3; }
        100% { transform: scale(1.3); opacity: 0.85; }
      }
      @keyframes beamMove {
        to { stroke-dashoffset: -400; }
      }
      @keyframes floatOrb {
        0% { transform: translateY(-12px) translateX(-6px); }
        100% { transform: translateY(14px) translateX(10px); }
      }
      @keyframes searchSweep {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        50% { opacity: 0.75; transform: scale(1.25); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: url(#title-grad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.5px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13.5px;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <rect class="glow-orb" x="0" y="0" width="550" height="360" fill="url(#cyan-glow)" pointer-events="none"/>
  <rect class="glow-orb" x="650" y="0" width="550" height="360" fill="url(#indigo-glow)" pointer-events="none"/>
  <rect class="glow-orb" x="350" y="100" width="500" height="260" fill="url(#emerald-glow)" pointer-events="none"/>

  <!-- Dynamic Search Radar Rings (Abstract Search Indexing) -->
  <g class="search-ring">
    <circle cx="1060" cy="100" r="45" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1060" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Dynamic Network Beams in Background -->
  <g opacity="0.45">
    <path class="beam-line" d="M 80 90 Q 240 180 440 110 T 740 230 T 1120 170" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="beam-line" d="M 120 270 Q 360 210 600 270 T 960 110 T 1150 90" fill="none" stroke="#818cf8" stroke-width="1.8"/>
  </g>

  <!-- Dynamic Pulsing Network Nodes in Background -->
  <g transform="translate(130, 95)">
    <circle class="node-pulse" r="22" fill="#00f2fe" opacity="0.25"/>
    <circle r="6" fill="#38bdf8"/>
  </g>
  <g transform="translate(1060, 100)">
    <circle class="node-pulse-fast" r="24" fill="#6366f1" opacity="0.25"/>
    <circle r="6" fill="#818cf8"/>
  </g>
  <g transform="translate(970, 265)">
    <circle class="node-pulse" r="20" fill="#38bdf8" opacity="0.2"/>
    <circle r="5" fill="#38bdf8"/>
  </g>
  <g transform="translate(90, 260)">
    <circle class="node-pulse-fast" r="18" fill="#10b981" opacity="0.2"/>
    <circle r="5" fill="#10b981"/>
  </g>

  <!-- Foreground Content: Pill Tag on Top -->
  <g transform="translate(460, 48)">
    <rect width="280" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="30" y="20" class="badge-text" fill="#38bdf8">ENTERPRISE SEARCH &amp; RAG</text>
  </g>

  <!-- Foreground Main Title -->
  <g transform="translate(600, 130)">
    <text text-anchor="middle" class="title-text">Awesome Enterprise Search</text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 172)">
    <text text-anchor="middle" class="subtitle-text">Curated Directory of Enterprise SaaS Solutions &amp; Top Open-Source Search Engines</text>
  </g>

  <!-- Foreground Category Pills -->
  <g transform="translate(100, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="42" rx="21" fill="url(#pill-grad)" class="pill-border"/>
      <text x="115" y="26" text-anchor="middle" class="pill-text">🔍 Neural &amp; Hybrid Search</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(250, 0)">
      <rect width="240" height="42" rx="21" fill="url(#pill-grad)" class="pill-border"/>
      <text x="120" y="26" text-anchor="middle" class="pill-text">🧠 RAG &amp; Workplace Q&amp;A</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(510, 0)">
      <rect width="250" height="42" rx="21" fill="url(#pill-grad)" class="pill-border"/>
      <text x="125" y="26" text-anchor="middle" class="pill-text">🛡️ Access Control &amp; RBAC</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(780, 0)">
      <rect width="220" height="42" rx="21" fill="url(#pill-grad)" class="pill-border"/>
      <text x="110" y="26" text-anchor="middle" class="pill-text">⚡ Sub-50ms Indexing</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
</svg>
